<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تقارير أمن الطرق</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 10% 10%,#1263a522,transparent 30%),
        radial-gradient(circle at 90% 90%,#008cff18,transparent 30%),
        linear-gradient(135deg,#03070c,#0a111b,#03070c);
}

.container{
    width:94%;
    max-width:1500px;
    margin:auto;
    padding:30px 0;
}

header{text-align:center;margin-bottom:25px}

header h1{
    color:#55aeff;
    margin:0;
    font-size:34px;
}

header p{color:#8290a3}

.layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.card{
    background:#0d1622ee;
    border:1px solid #20334a;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 15px 40px #0006;
}

.card h2{
    color:#5db4ff;
    font-size:20px;
    border-bottom:1px solid #20334a;
    padding-bottom:12px;
    margin-top:0;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    color:#aebaca;
    font-size:13px;
    margin-bottom:7px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #293e56;
    background:#08101a;
    color:#fff;
    outline:none;
}

input:focus,select:focus{
    border-color:#299aff;
    box-shadow:0 0 0 2px #299aff22;
}

.person{
    display:grid;
    grid-template-columns:1fr 1fr 42px;
    gap:8px;
    margin-bottom:12px;
}

.logout-row{
    display:grid;
    grid-template-columns:1fr 42px;
    gap:8px;
    margin-bottom:12px;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.1);
}

.add{background:#126dcc}
.delete{background:#a52b38}

.copy{
    background:#159447;
    width:100%;
    font-size:17px;
    margin-bottom:10px;
}

.clear{
    background:#8e2936;
    width:100%;
}

.preview{
    position:sticky;
    top:20px;
    height:max-content;
}

.preview-box{
    background:#070c12;
    border:1px solid #263b53;
    border-radius:12px;
    padding:20px;
    min-height:650px;
    white-space:pre-wrap;
    direction:rtl;
    text-align:right;
    line-height:2;
    font-family:Tahoma,Arial,sans-serif;
    overflow:auto;
}

.shared-box{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

.shared-box select{
    flex:1;
}

.shared-box button{
    white-space:nowrap;
}

.hint{
    color:#66778b;
    font-size:12px;
    margin-top:7px;
}

@media(max-width:1000px){
    .layout{grid-template-columns:1fr}
    .preview{position:static}
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>نظام تقارير أمن الطرق</h1>
    <p>إنشاء وترتيب التقارير والنسخ المباشر لديسكورد</p>
</header>

<div class="layout">

<!-- الجانب الأيسر -->

<div>

<div class="card">
<h2>معلومات التقرير</h2>

<div class="form-row">

<div>
<label>وقت البداية</label>
<input id="startTime" value="02:30 ص" oninput="updatePreview()">
</div>

<div>
<label>وقت النهاية</label>
<input id="endTime" value="03:00 ص" oninput="updatePreview()">
</div>

</div>

<br>

<label>العمليات — آيدي ديسكورد</label>
<input id="operations"
placeholder="مثال: 1521722054611832887"
oninput="updatePreview()">

<div class="hint">
اكتب آيدي الشخص فقط، وسيتم تحويله تلقائيًا إلى &lt;@ID&gt;
</div>

<br>

<label>نائب العمليات — آيدي ديسكورد</label>
<input id="deputy"
placeholder="مثال: 1025155496694513745"
oninput="updatePreview()">

</div>


<div id="sections"></div>


<!-- تسجيل الخروج -->

<div class="card">

<h2>تسجيل خروج</h2>

<div id="logoutList"></div>

<button class="add" onclick="addLogout()">+ إضافة كود</button>

</div>


<!-- السبب -->

<div class="card">

<h2>سبب نزول التقرير مبكرًا</h2>

<select id="reason" onchange="reasonChanged();updatePreview()">
<option value="">بدون سبب</option>
<option>ريستارت</option>
<option>ضعف خبرة</option>
<option>اصطفاف</option>
<option>صيانة</option>
<option>اجتماع</option>
<option>تغيير شفت</option>
<option>ظروف طارئة</option>
<option>أخرى</option>
</select>

<div id="customReason" style="display:none;margin-top:10px">
<label>السبب</label>
<input id="otherReason"
placeholder="اكتب السبب"
oninput="updatePreview()">
</div>

</div>

<button class="copy" onclick="copyReport()">
📋 نسخ التقرير
</button>

<button class="clear" onclick="clearAll()">
🗑️ مسح التقرير
</button>

</div>


<!-- المعاينة -->

<div class="card preview">

<h2>معاينة التقرير</h2>

<div id="preview" class="preview-box"></div>

</div>

</div>
</div>


<script>

/* =========================
   القائمة المشتركة للمناصب
========================= */

const sharedPositions = [
    "سيف 1",
    "م سيف 1",
    "سيف 2",
    "م سيف 2",

    "رصد 1",
    "رصد 2",
    "رصد 3",
    "م رصد 3",

    "ساهر 1",
    "ساهر 2",
    "ساهر 3",
    "ساهر 4",

    "امان 1",
    "امان 2",
    "امان 3",

    "الشرطة العسكرية",

    "شهاب 1",
    "شهاب 2",
    "شهاب 3",
    "شهاب 4",
    "شهاب 5",
    "شهاب 6",

    "صقر 1",
    "صقر 2",
    "صقر 3",
    "صقر 4",

    "بيتا 10",
    "بيتا 11",
    "بيتا 12",
    "م بيتا 12",
    "بيتا 13",
    "بيتا 14",

    "برافو 10",
    "برافو 11",
    "برافو 12",
    "برافو 13",
    "برافو 14",

    "دلتا 10",
    "م دلتا 10",
    "دلتا 11",
    "دلتا 12",
    "دلتا 13",
    "دلتا 14",

    "دلتا 20"
];


/* =========================
   الأقسام
========================= */

const sections = [

{
    title:"الضباط",
    defaultItems:[
        ["سيف 1",""],
        ["م سيف 1",""],
        ["سيف 2",""],
        ["رصد 1",""],
        ["رصد 2",""],
        ["رصد 3",""],
        ["م رصد 3",""],
        ["ساهر 1",""],
        ["ساهر 2",""],
        ["ساهر 4",""],
        ["امان 1",""],
        ["امان 2",""],
        ["الشرطة العسكرية",""]
    ]
},

{
    title:"الدورات المفعلة",
    defaultItems:[]
},

{
    title:"المهام والواجبات الخاصة",
    defaultItems:[]
},

{
    title:"دعم جوي",
    defaultItems:[]
},

{
    title:"بيتا",
    defaultItems:[
        ["بيتا 10",""],
        ["بيتا 11",""],
        ["بيتا 12",""],
        ["م بيتا 12",""],
        ["بيتا 13",""],
        ["بيتا 14",""]
    ]
},

{
    title:"برافو",
    defaultItems:[
        ["برافو 10",""],
        ["برافو 11",""],
        ["برافو 12",""],
        ["برافو 13",""],
        ["برافو 14",""]
    ]
},

{
    title:"دلتا 1",
    defaultItems:[
        ["دلتا 10",""],
        ["م دلتا 10",""],
        ["دلتا 11",""],
        ["دلتا 12",""],
        ["دلتا 13",""],
        ["دلتا 14",""]
    ]
},

{
    title:"دلتا 2",
    defaultItems:[
        ["دلتا 20",""]
    ]
}

];


/* =========================
   إنشاء الأقسام
========================= */

sections.forEach((section,index)=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

        <h2>${section.title}</h2>

        <div class="shared-box">

            <select id="shared-${index}">
                <option value="">اختر من المناصب المشتركة</option>
                ${sharedPositions.map(x=>`<option value="${x}">${x}</option>`).join("")}
            </select>

            <button class="add"
                    onclick="addShared(${index})">
                إضافة
            </button>

        </div>

        <div id="list-${index}"></div>

        <button class="add"
                onclick="addPerson(${index})">
            + إضافة شخص
        </button>

    `;

    document.getElementById("sections").appendChild(card);

    section.defaultItems.forEach(item=>{
        addPerson(index,item[0],item[1]);
    });

});


/* =========================
   إضافة من القائمة المشتركة
========================= */

function addShared(index){

    const select=document.getElementById(`shared-${index}`);

    const name=select.value;

    if(!name){
        alert("اختر منصب أولاً");
        return;
    }

    addPerson(index,name,"");

    select.value="";
}


/* =========================
   إضافة شخص
========================= */

function addPerson(index,name="",code=""){

    const list=document.getElementById(`list-${index}`);

    const row=document.createElement("div");

    row.className="person";

    row.innerHTML=`

        <input class="person-name"
               value="${escapeHtml(name)}"
               placeholder="المسمى"
               oninput="updatePreview()">

        <input class="person-code"
               value="${escapeHtml(code)}"
               placeholder="الكود مثل P-032"
               oninput="updatePreview()">

        <button class="delete"
                onclick="
                    this.parentElement.remove();
                    updatePreview();
                ">
            ×
        </button>

    `;

    list.appendChild(row);

    updatePreview();
}


/* =========================
   تسجيل الخروج
========================= */

function addLogout(code=""){

    const list=document.getElementById("logoutList");

    const row=document.createElement("div");

    row.className="logout-row";

    row.innerHTML=`

        <input class="logout-code"
               value="${escapeHtml(code)}"
               placeholder="مثال P-277"
               oninput="updatePreview()">

        <button class="delete"
                onclick="
                    this.parentElement.remove();
                    updatePreview();
                ">
            ×
        </button>

    `;

    list.appendChild(row);

    updatePreview();
}


/* =========================
   السبب
========================= */

function reasonChanged(){

    const value=document.getElementById("reason").value;

    document.getElementById("customReason").style.display =
        value==="أخرى" ? "block" : "none";
}


/* =========================
   منشن ديسكورد
========================= */

function discordMention(id){

    id=id.trim();

    if(!id) return "";

    if(id.startsWith("<@")){
        return id;
    }

    return `<@${id}>`;
}


/* =========================
   إنشاء التقرير
========================= */

function updatePreview(){

    let text="";

    const start=document.getElementById("startTime").value.trim();

    const end=document.getElementById("endTime").value.trim();

    const operations=discordMention(
        document.getElementById("operations").value
    );

    const deputy=discordMention(
        document.getElementById("deputy").value
    );


    text+=`تم استلام مهام العمليات لأمن الطرق في تمام الساعة ${start} الى ${end}\n\n`;

    text+=`تقرير\n\n`;

    text+=`الــعمــلـيـات | ${operations || "لا يوجد"}\n\n`;

    text+=`نــائـــب الــعمــلـيـات | ${deputy || "لا يوجد"}\n\n`;

    text+=`—————————————————\n\n`;


    sections.forEach((section,index)=>{

        const list=document.getElementById(`list-${index}`);

        const people=[...list.querySelectorAll(".person")];

        const valid=people.filter(person=>{

            const name=person.querySelector(".person-name").value.trim();

            const code=person.querySelector(".person-code").value.trim();

            return name || code;

        });


        if(section.title==="الضباط"){

            valid.forEach(person=>{

                const name=person.querySelector(".person-name").value.trim();

                const code=person.querySelector(".person-code").value.trim();

                text+=`${name} | ${code}\n\n`;

            });

            return;
        }


        if(section.title==="الدورات المفعلة"){

            text+=`الدورات المفعلة :\n\n`;

        }
        else{

            text+=`${section.title} :\n\n`;

        }


        valid.forEach(person=>{

            const name=person.querySelector(".person-name").value.trim();

            const code=person.querySelector(".person-code").value.trim();

            text+=`${name} | ${code}\n\n`;

        });


        text+=`—————————————————\n\n`;

    });


    text+=`تسجيل خروج :\n\n`;


    const logout=[
        ...document.querySelectorAll(".logout-code")
    ];


    logout.forEach(input=>{

        const code=input.value.trim();

        if(code){

            text+=`${code}\n`;

        }

    });


    const reason=document.getElementById("reason").value;

    let finalReason=reason;


    if(reason==="أخرى"){

        finalReason=
            document.getElementById("otherReason").value.trim();

    }


    if(finalReason){

        text+=`\nسبب نزول التقرير مبكرا : ${finalReason}`;

    }


    document.getElementById("preview").textContent=
        text.trim();

}


/* =========================
   نسخ التقرير
========================= */

async function copyReport(){

    const text=
        document.getElementById("preview").textContent;

    try{

        await navigator.clipboard.writeText(text);

        alert("تم نسخ التقرير بنجاح ✅");

    }
    catch(e){

        const textarea=document.createElement("textarea");

        textarea.value=text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("تم نسخ التقرير بنجاح ✅");

    }

}


/* =========================
   مسح
========================= */

function clearAll(){

    if(confirm("هل تريد مسح التقرير بالكامل؟")){

        location.reload();

    }

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* تسجيل خروج افتراضي */

addLogout();

updatePreview();

</script>

</body>
</html>
